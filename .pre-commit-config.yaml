repos:
  - repo: local
    hooks:
      - id: slint-format
        name: Slint Format
        entry: slint-lsp format --inline
        language: system
        files: '\.(slint|60)$'

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false